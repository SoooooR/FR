<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭网站 - 活动中心</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">🏠 家庭网站</a>
    <div class="nav-links">
      <a href="index.html">首页</a>
      <a href="activities.html" class="active">活动中心</a>
      <a href="fund.html">资金审批</a>
      <a href="resources.html">资源分享</a>
    </div>
    <div class="user-actions">
      欢迎，<span id="current-user">加载中...</span>
      <a href="javascript:void(0)" onclick="changePassword()">改密</a>
      <a href="javascript:void(0)" onclick="logout()">退出</a>
    </div>
  </nav>

  <div class="container">
    <!-- 区域 1：仅管理员可见（发布活动） -->
    <div class="form-card" id="create-activity-card" style="display:none;">
      <h2>📢 发布新活动（仅管理员）</h2>
      <div class="form-group"><label>活动名称</label><input type="text" id="act-title" placeholder="例如：成长计划"></div>
      <div class="form-group"><label>活动金额</label><input type="text" id="act-reward" placeholder="例如：1000元"></div>
      <div class="form-group"><label>活动详情</label><textarea id="act-desc" placeholder="描述活动内容、规则..."></textarea></div>
      <button class="btn-submit" onclick="createActivity()">发布活动</button>
    </div>

    <!-- 区域 2：仅管理员可见（审核记录） -->
    <div class="form-card" id="pending-apps-card" style="display:none; border-left: 4px solid #f59e0b;">
      <h2>📋 待审核的活动申请</h2>
      <div id="pending-apps-list"></div>
      
      <!-- 历史记录区（嵌套在审核卡片内部是合理的） -->
      <div id="admin-all-act-records" style="display:none; margin-top: 20px;">
        <h3 style="margin-top:32px; margin-bottom:16px; color:#fff;">📚 历史活动申请记录（管理员视图）</h3>
        <div id="all-act-list"></div>
      </div>
    </div>

    <!-- 区域 3：所有人可见（进行中的活动） -->
    <!-- ⚠️ 注意：这个 h2 和 div 必须在所有管理员专属 div 的【外面】！ -->
    <h2 style="margin-bottom:15px; font-size:18px; color:#fff;">🎯 进行中的活动</h2>
    <div id="activities-list"></div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="activities.js"></script>
</body>
</html>
