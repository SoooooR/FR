<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>家庭网站 - 登录</title>
</head>
<body>
  <h1>家庭网站</h1>

  <!-- 登录表单 -->
  <div id="login-form">
    <h2>登录</h2>
    <input type="email" id="login-email" placeholder="邮箱" onkeydown="if(event.key === 'Enter') login()">
    <input type="password" id="login-password" placeholder="密码" onkeydown="if(event.key === 'Enter') login()">
    <button onclick="login()">登录</button>
    <p>没有账号？<a href="javascript:void(0)" onclick="showRegister()">注册</a></p>
  </div>

  <!-- 注册表单 -->
  <div id="register-form" style="display:none">
    <h2>注册</h2>
        <input type="text" id="reg-username" placeholder="用户名" onkeydown="if(event.key === 'Enter') register()">
    <input type="email" id="reg-email" placeholder="邮箱" onkeydown="if(event.key === 'Enter') register()">
    <input type="password" id="reg-password" placeholder="密码" onkeydown="if(event.key === 'Enter') register()">
    <button onclick="register()">注册</button>
    <p>已有账号？<a href="javascript:void(0)" onclick="showLogin()">登录</a></p>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
   <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const authApp = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // 辅助函数：确保 profiles 表里有这个用户，但绝不覆盖已有的名字！
    async function ensureProfile(userId, username) {
      // 先检查有没有资料
      const { data, error } = await authApp.from('profiles').select('id').eq('id', userId).single();
      if (error && error.code !== 'PGRST116') { 
        console.error('查询资料失败：', error); 
        return; 
      }
      
      // 如果没有资料才插入，有资料直接跳过（不执行update，就不会覆盖）
      if (!data) {
        await authApp.from('profiles').insert({
          id: userId,
          username: username || '用户_' + userId.substring(0, 5)
        });
      }
    }

    async function register() {
      const username = document.getElementById('reg-username').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;

      const { data, error } = await authApp.auth.signUp({ email, password });
      if (error) { alert('注册失败：' + error.message); return; }

      if (data.user) {
        await ensureProfile(data.user.id, username);
      }
      alert('注册成功！请直接登录。');
    }

    async function login() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const { data, error } = await authApp.auth.signInWithPassword({ email, password });
      if (error) { alert('登录失败：' + error.message); return; }

      // 登录成功后，检查资料是否存在，没有就补上
      if (data.user) {
        await ensureProfile(data.user.id, null);
      }
      
      window.location.href = 'index.html';
    }

    function showRegister() {
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('register-form').style.display = 'block';
    }
    function showLogin() {
      document.getElementById('login-form').style.display = 'block';
      document.getElementById('register-form').style.display = 'none';
    }
  </script>
</body>
</html>
