<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭网站 - 主页</title>
  <style>
    /* 全局变量，方便统一调整颜色 */
    :root {
      --primary-color: #4f46e5; /* 高级感靛蓝色 */
      --primary-hover: #4338ca;
      --bg-color: #f3f4f6;      /* 浅灰背景 */
      --card-bg: #ffffff;       /* 纯白卡片 */
      --text-main: #1f2937;     /* 深灰色主文字 */
      --text-muted: #6b7280;    /* 浅灰色辅助文字 */
      --border-color: #e5e7eb;  /* 极浅的边框色 */
      --radius: 12px;           /* 统一圆角 */
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    /* 基础重置 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      max-width: 860px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    /* 顶部导航栏 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 20px 25px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }
    header h1 { font-size: 24px; font-weight: 700; letter-spacing: 0.5px; }
    .user-info { font-size: 14px; color: var(--text-muted); display: flex; align-items: center; gap: 12px; }
    .user-info span { color: var(--primary-color); font-weight: 600; }
    .user-info a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; font-weight: 500;}
    .user-info a:hover { color: var(--primary-color); }

    /* 导航按钮 */
    nav {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
    }
    nav button {
      flex: 1;
      padding: 14px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    nav button:hover {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(79, 70, 229, 0.2);
    }

    /* 卡片通用样式 */
    .card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 30px;
      border: 1px solid var(--border-color);
    }
    .card h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
    }

    /* 表单美化 */
    .form-group {
      margin-bottom: 18px;
    }
    .form-group input, 
    .form-group textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      color: var(--text-main);
      background: #f9fafb;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus, 
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary-color);
      background: white;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }
    .form-group textarea {
      min-height: 140px;
      resize: vertical;
    }

    /* 按钮美化 */
    .btn-submit {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-submit:hover { background: var(--primary-hover); }
    .btn-submit:active { transform: scale(0.98); }

    /* 帖子列表样式（高级卡片） */
    .post-item {
      background: var(--card-bg);
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      transition: transform 0.2s;
    }
    .post-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
    }
    .post-item h3 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .post-meta {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .post-meta::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--primary-color);
      border-radius: 50%;
    }
    .post-content {
      font-size: 15px;
      line-height: 1.8;
      color: #374151;
      white-space: pre-wrap;
    }

    /* 标题小标 */
    .section-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <!-- 顶部 -->
  <header>
    <h1>🏠 家庭网站</h1>
    <div class="user-info">
      欢迎，<span id="current-user">加载中...</span>
      <a href="javascript:void(0)" onclick="changeUsername()">修改昵称</a>
      <a href="javascript:void(0)" onclick="logout()">退出</a>
    </div>
  </header>

  <!-- 导航 -->
  <nav>
    <button onclick="showSection('posts')">📝 发帖</button>
    <button onclick="showSection('fund')">💰 资金审批</button>
    <button onclick="showSection('resources')">🔧 资源分享</button>
  </nav>

  <!-- 板块1：发帖 -->
  <div id="posts-section">
    <div class="card">
      <h2>✍️ 写一篇新帖子</h2>
      <div class="form-group">
        <input type="text" id="post-title" placeholder="输入帖子标题...">
      </div>
      <div class="form-group">
        <textarea id="post-content" placeholder="写下你想分享的内容..."></textarea>
      </div>
      <button class="btn-submit" onclick="createPost()">发布帖子</button>
    </div>
    
    <div class="section-title">📌 最新帖子</div>
    <div id="posts-list"></div>
  </div>

  <!-- 板块2：资金审批 -->
  <div id="fund-section" style="display:none">
    <div class="card">
      <h2>💰 提交资金申请</h2>
      <div class="form-group">
        <input type="number" id="fund-amount" placeholder="申请金额（元）">
      </div>
      <div class="form-group">
        <textarea id="fund-reason" placeholder="申请理由..."></textarea>
      </div>
      <div class="form-group">
        <input type="text" id="reviewer-id" placeholder="审核人的用户ID（UUID）">
      </div>
      <button class="btn-submit" onclick="submitFundRequest()">提交申请</button>
    </div>
    <div id="my-requests"></div>
    <div id="pending-reviews"></div>
  </div>

  <!-- 板块3：资源分享 -->
  <div id="resources-section" style="display:none">
    <div class="card">
      <h2>🔧 分享新资源</h2>
      <div class="form-group">
        <input type="text" id="resource-title" placeholder="资源名称（如：好用的记账软件）">
      </div>
      <div class="form-group">
        <input type="url" id="resource-url" placeholder="资源链接（https://...）">
      </div>
      <div class="form-group">
        <textarea id="resource-desc" placeholder="简单描述一下..."></textarea>
      </div>
      <button class="btn-submit" onclick="shareResource()">分享资源</button>
    </div>
    <div class="section-title">📌 已分享资源</div>
    <div id="resources-list"></div>
  </div>

  <!-- 脚本引入 -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
