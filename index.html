<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭网站 - 首页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">🏠 家庭网站</a>
    <div class="nav-links">
      <a href="index.html" class="active">首页发帖</a>
      <a href="fund.html">资金审批</a>
      <a href="resources.html">资源分享</a>
    </div>
    <div class="user-actions">
      欢迎，<span id="current-user">加载中...</span>
      <a href="javascript:void(0)" onclick="changeUsername()">改名</a>
      <a href="javascript:void(0)" onclick="logout()">退出</a>
    </div>
  </nav>

  <div class="container">
    <!-- 知乎风格发帖框 -->
    <div class="publish-card">
      <input type="text" id="post-title" placeholder="输入标题（选填）">
      <textarea id="post-content" placeholder="分享你的家庭故事、生活点滴..."></textarea>
      <div class="publish-footer">
        <button onclick="createPost()">发布</button>
      </div>
    </div>

    <!-- 帖子展示区 -->
    <div id="posts-list"></div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
