<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭网站 - 首页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">🏠 家庭网站</a>
    <div class="nav-links">
      <a href="index.html" class="active">首页发帖</a>
      <a href="fund.html">资金审批</a>
      <a href="resources.html">资源分享</a>
    </div>
    <div class="user-actions">
      欢迎，<span id="current-user">加载中...</span>
      <a href="javascript:void(0)" onclick="changeUsername()">改名</a>
      <a href="javascript:void(0)" onclick="logout()">退出</a>
    </div>
  </nav>

  <div class="container">
    <div class="layout-grid">
      <!-- 左侧主内容 -->
      <div class="main-content">
        <div class="publish-card">
          <input type="text" id="post-title" placeholder="输入标题（选填）">
          <textarea id="post-content" placeholder="分享你的家庭故事、生活点滴..."></textarea>
          <div class="publish-footer"><button onclick="createPost()">发布</button></div>
        </div>
        <div id="posts-list"></div>
      </div>

      <!-- 右侧侧边栏 -->
      <div class="sidebar">
        <div class="sidebar-card">
          <h4>👑 管理员信息</h4>
          <p><span class="admin-role">超级管理员</span></p>
          <p>昵称：<strong>Prime</strong></p>
          <p>邮箱：admin@family.com</p>
          <p>微信：family_admin</p>
          <p style="font-size:12px; color:#999; margin-top:15px;">如有账号问题、审批权限疑问，请联系管理员。</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
