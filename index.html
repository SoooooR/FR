<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭网站 - 首页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">🏠 家庭网站</a>
    <div class="nav-links">
      <a href="index.html" class="active">首页</a>
      <a href="activities.html">活动中心</a>
      <a href="fund.html">资金审批</a>
      <a href="resources.html">资源分享</a>
    </div>
    <div class="user-actions">
      欢迎，<span id="current-user">加载中...</span>
      <a href="javascript:void(0)" onclick="changeUsername()">改名</a>
      <a href="javascript:void(0)" onclick="changePassword()">改密</a>
      <a href="javascript:void(0)" onclick="logout()">退出</a>
    </div>
  </nav>

  <!-- 核心布局：居中容器 -->
  <div class="app-container">
    
    <!-- 左侧主内容区域 -->
    <main class="main-feed">
      <!-- 发帖卡片 -->
      <div class="publish-card glass-card">
        <input type="text" id="post-title" class="publish-title" placeholder="输入标题（选填）">
        <textarea id="post-content" class="publish-content" placeholder="说些什么呗吧 😄"></textarea>
        <div class="publish-footer">
          <button class="btn-primary" onclick="createPost()">发布</button>
        </div>
      </div>

      <!-- 帖子列表 -->
      <div id="posts-list"></div>
    </main>

    <!-- 右侧侧边栏 -->
    <aside class="sidebar">
      <div class="glass-card sidebar-card">
        <h4 class="sidebar-title">👨‍👩‍👧‍👦 家庭成员</h4>
        <div id="member-list"><p style="font-size:13px; color:#999;">加载中...</p></div>
      </div>
            <div class="glass-card sidebar-card" style="margin-top: 24px;">
        <h4 class="sidebar-title">🎵 背景音乐</h4>
        <!-- ⚠️ 把 src 换成你自己的音乐链接（建议用 .mp3 链接） -->
        <audio id="bg-music" loop>
          <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        </audio>
        <div class="music-player">
          <button id="play-btn" class="music-btn" onclick="togglePlay()">▶️ 播放</button>
          <div class="volume-control">
            <span>🔊</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.3" onchange="changeVolume()">
          </div>
        </div>
      </div>
    </aside>

  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
